server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /cadets { return 301 /cadets/; }
  location /cadets/ {
    proxy_pass http://cadet-academy/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /cadets;
  }

  location = /navigators { return 301 /navigators/; }
  location /navigators/ {
    proxy_pass http://navigator-academy/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /navigators;
  }

  location = /communication-officers { return 301 /communication-officers/; }
  location /communication-officers/ {
    proxy_pass http://officer-academy/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /communication-officers;
  }

  location = /commanders { return 301 /commanders/; }
  location /commanders/ {
    proxy_pass http://commander-academy/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /commanders;
  }

  location = /tracker { return 301 /tracker/; }
  location /tracker/ {
    proxy_pass http://community-tracker:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    client_max_body_size 8k;
    access_log off;
    proxy_pass http://community-tracker:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
